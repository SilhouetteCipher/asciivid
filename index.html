<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCIIVD — dither &amp; ascii video lab</title>
<style>
:root{
  --bg:#0b0b0c;
  --panel:#111113;
  --panel2:#161619;
  --line:#26262b;
  --line2:#34343b;
  --txt:#e7e7e4;
  --dim:#8c8c92;
  --dimmer:#5c5c63;
  --sig:#ff5b1f;
  --ok:#9dff3d;
  --font:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);font:12px/1.4 var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b2b31;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:var(--panel)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:290px 1fr 250px;grid-template-rows:38px minmax(0,1fr);height:100vh}
header{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
header .brand{font-weight:700;letter-spacing:.22em;font-size:11px}
header .brand span{color:var(--sig)}
header .meta{color:var(--dimmer);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
header .spacer{flex:1}
.hbtn{
  background:transparent;border:1px solid var(--line2);color:var(--txt);
  padding:4px 10px;cursor:pointer;letter-spacing:.1em;font-size:10px;text-transform:uppercase;
}
.hbtn:hover{border-color:var(--sig);color:var(--sig)}
.hbtn.primary{border-color:var(--sig);color:var(--sig)}
.hbtn.primary:hover{background:var(--sig);color:#000}
.hbtn.rec.armed{background:var(--sig);color:#000;border-color:var(--sig)}

/* ---------- sidebars ---------- */
aside{background:var(--panel);overflow-y:auto;overflow-x:hidden}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
.group{border-bottom:1px solid var(--line)}
.group>h3{
  margin:0;padding:8px 10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none;
  background:var(--panel);position:sticky;top:0;z-index:2;
}
.group>h3:hover{color:var(--txt)}
.group>h3::before{content:"−";color:var(--sig);width:9px;display:inline-block}
.group.collapsed>h3::before{content:"+"}
.group.collapsed .gbody{display:none}
.gbody{padding:4px 10px 10px}
.row{display:grid;grid-template-columns:78px 1fr 42px;align-items:center;gap:7px;margin:5px 0;min-height:19px}
.row>label{color:var(--dim);font-size:10px;letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.wide{grid-template-columns:78px 1fr}
.row .val{color:var(--sig);font-size:10px;text-align:right;font-variant-numeric:tabular-nums}
.row.dirty>label{color:var(--txt)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:14px;background:var(--txt);margin-top:-6px;border-radius:0}
input[type=range]:hover::-webkit-slider-thumb{background:var(--sig)}
select,input[type=text],input[type=number]{
  width:100%;background:var(--panel2);border:1px solid var(--line);padding:3px 5px;font-size:11px;border-radius:0;
}
select:focus,input:focus{outline:none;border-color:var(--sig)}
input[type=color]{width:100%;height:20px;padding:0;background:none;border:1px solid var(--line);cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.chk input{accent-color:var(--sig);width:12px;height:12px;margin:0;cursor:pointer}
.btnrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.mini{
  flex:1;min-width:56px;background:var(--panel2);border:1px solid var(--line);padding:4px 5px;
  cursor:pointer;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
}
.mini:hover{border-color:var(--sig);color:var(--sig)}
.mini.on{border-color:var(--sig);color:var(--sig)}
.note{color:var(--dimmer);font-size:10px;line-height:1.5;margin:6px 0 0}

/* ---------- stage ---------- */
/* min-height:0 on main and #stage lets the stage shrink to what's left above the
   transport, so a tall (9:16) frame scales down instead of pushing the timeline off. */
main{display:flex;flex-direction:column;background:#000;min-width:0;min-height:0}
#stage{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:
    linear-gradient(45deg,#0e0e10 25%,transparent 25%,transparent 75%,#0e0e10 75%),
    linear-gradient(45deg,#0e0e10 25%,#0a0a0b 25%,#0a0a0b 75%,#0e0e10 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
}
#out{max-width:100%;max-height:100%;image-rendering:pixelated;box-shadow:0 0 0 1px var(--line)}
#drop{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--dim);text-align:center;background:rgba(0,0,0,.72);z-index:5;
}
#drop.hide{display:none}
#drop.hot{background:rgba(255,91,31,.12);color:var(--sig)}
#drop h2{font-size:13px;letter-spacing:.3em;margin:0;text-transform:uppercase}
#maskLayer{position:absolute;pointer-events:none;display:none}
#maskLayer.on{display:block}
#stage.drawing #maskLayer{pointer-events:auto;cursor:crosshair}
#maskhint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:none;
  background:rgba(0,0,0,.8);border:1px solid var(--sig);color:var(--sig);
  padding:4px 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;z-index:6;
}
#stage.drawing #maskhint{display:block}
#badge{
  position:absolute;left:10px;top:10px;font-size:10px;color:var(--dimmer);letter-spacing:.1em;
  background:rgba(0,0,0,.55);padding:3px 6px;pointer-events:none;
}
#recdot{
  position:absolute;right:10px;top:10px;display:none;align-items:center;gap:6px;font-size:10px;
  letter-spacing:.14em;color:#fff;background:rgba(0,0,0,.6);padding:4px 8px;
}
#recdot.on{display:flex}
#recdot i{width:8px;height:8px;background:var(--sig);border-radius:50%;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* ---------- transport ---------- */
#transport{border-top:1px solid var(--line);background:var(--panel);padding:7px 10px 9px}
#scrubwrap{position:relative;height:22px;margin-bottom:6px}
#trim{position:absolute;left:0;right:0;top:9px;height:4px;background:var(--line);pointer-events:none}
#trimsel{position:absolute;top:9px;height:4px;background:var(--sig);opacity:.5;pointer-events:none}
#scrub{position:absolute;inset:0;width:100%;margin:0;background:transparent}
#tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{background:transparent;border:1px solid var(--line2);color:var(--txt);padding:3px 9px;cursor:pointer;font-size:11px}
.tbtn:hover{border-color:var(--sig);color:var(--sig)}
#tc{color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
#tc b{color:var(--txt);font-weight:400}
#fpsread{margin-left:auto;color:var(--dimmer);font-size:10px;letter-spacing:.1em}

/* ---------- presets / right col ---------- */
.plist{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.pitem{display:flex;align-items:center;gap:4px}
.pitem button.pload{
  flex:1;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:5px 7px;cursor:pointer;font-size:11px;letter-spacing:.04em;
}
.pitem button.pload:hover{border-color:var(--sig);color:var(--sig)}
.pitem button.pdel{background:none;border:1px solid var(--line);color:var(--dimmer);cursor:pointer;padding:5px 6px}
.pitem button.pdel:hover{color:var(--sig);border-color:var(--sig)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.sw{
  border:1px solid var(--line);padding:6px 4px 5px;cursor:pointer;text-align:center;
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25;border-radius:0;
}
.sw b{display:block;font-size:13px;font-weight:400;letter-spacing:.08em;margin-bottom:1px}
.sw:hover{border-color:var(--sig)}
.sw.on{border-color:var(--sig);box-shadow:inset 0 0 0 1px var(--sig)}
kbd{background:var(--panel2);border:1px solid var(--line2);padding:0 4px;font-size:10px;color:var(--dim)}
@media(max-width:1180px){#app{grid-template-columns:270px 1fr}aside.right{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">ASCII<span>VD</span></div>
    <div class="meta" id="srcinfo">no source</div>
    <div class="spacer"></div>
    <button class="hbtn" id="btnOpen">Open video</button>
    <button class="hbtn" id="btnCam">Webcam</button>
    <button class="hbtn" id="btnPng">Save frame</button>
    <button class="hbtn primary rec" id="btnRec">● Record</button>
    <button class="hbtn" id="btnMp4">Export MP4</button>
    <button class="hbtn" id="btnSeq">PNG sequence</button>
  </header>

  <aside class="left" id="panelL"></aside>

  <main>
    <div id="stage">
      <canvas id="out"></canvas>
      <canvas id="maskLayer"></canvas>
      <div id="maskhint">drag to add · centre handle moves · corners resize · ⌫ or double-click removes · esc to finish</div>
      <div id="badge">—</div>
      <div id="recdot"><i></i><span id="rectime">REC 0.0s</span></div>
      <div id="drop">
        <h2>Drop a video here</h2>
        <div>mp4 / mov / webm — or click “Open video”. Nothing is uploaded; all processing is local.</div>
      </div>
    </div>
    <div id="transport">
      <div id="scrubwrap">
        <div id="trim"></div><div id="trimsel"></div>
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1">
      </div>
      <div id="tbar">
        <button class="tbtn" id="btnPlay">▶</button>
        <button class="tbtn" id="btnBack">◀|</button>
        <button class="tbtn" id="btnFwd">|▶</button>
        <button class="tbtn" id="btnIn">[ in</button>
        <button class="tbtn" id="btnOut">out ]</button>
        <button class="tbtn" id="btnClr">clear trim</button>
        <label class="chk" style="margin-left:4px"><input type="checkbox" id="loopChk" checked><span style="color:var(--dim)">loop</span></label>
        <div id="tc"><b>00:00.00</b> / 00:00.00 &nbsp;·&nbsp; in <span id="tin">—</span> out <span id="tout">—</span></div>
        <div id="fpsread">— fps</div>
      </div>
    </div>
  </main>

  <aside class="right" id="panelR"></aside>
</div>

<input type="file" id="fileIn" accept="video/*" hidden>
<input type="file" id="presetIn" accept="application/json,.json" hidden>
<!-- kept in the layout rather than display:none: hidden videos are not guaranteed
     to decode or present frames while paused, which blanks frame grabs -->
<video id="src" playsinline muted crossorigin="anonymous"
       style="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1"></video>

<script>
"use strict";
/* =========================================================================
   ASCIIVD — monochrome video lab
   Everything runs locally in the browser. No network, no libraries.
   ========================================================================= */

/* ---------------------------------------------------------------- schema */
const CHARSETS = {
  "shades 10"  : " .:-=+*#%@",
  "classic 70" : " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
  "marathon"   : " .·:-=≡▒▓█",
  "blocks"     : " ░▒▓█",
  "bars"       : " ▏▎▍▌▋▊▉█",
  "minimal"    : " .:*#@",
  "dots"       : " ·∙•◦●",
  "binary"     : " 01",
  "hatch"      : " ╌─╪╬█",
  "tech"       : " ·+=*xX#@█",
  "kana"       : " ｡ｰ=ﾆｷﾒﾊﾎﾑ█",
  "arrows"     : " ˙˘¯‾↑↟▲█",
  "custom"     : null
};

const FONTS = {
  "system mono" : 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',
  "courier"     : '"Courier New",Courier,monospace',
  "menlo"       : 'Menlo,monospace',
  "monaco"      : 'Monaco,monospace',
  "andale"      : '"Andale Mono",monospace',
  "pt mono"     : '"PT Mono",monospace',
  "sans"        : '"Helvetica Neue",Arial,sans-serif'
};

/* ----------------------------------------------------------------------
   Hardware palettes. Values are the usual community-accepted RGB renderings
   of each machine's output — close enough that the footage reads as that era.
   ---------------------------------------------------------------------- */
const PALETTES8 = {
  "game boy": ["#0f380f","#306230","#8bac0f","#9bbc0f"],
  "game boy pocket": ["#181818","#4a4a4a","#8c8c8c","#c5c5c5"],
  "virtual boy": ["#000000","#550000","#aa0000","#ff0000"],
  "cga 1 (cyan/magenta)": ["#000000","#55ffff","#ff55ff","#ffffff"],
  "cga 2 (green/red)": ["#000000","#55ff55","#ff5555","#ffff55"],
  "cga 16": ["#000000","#0000aa","#00aa00","#00aaaa","#aa0000","#aa00aa","#aa5500","#aaaaaa",
             "#555555","#5555ff","#55ff55","#55ffff","#ff5555","#ff55ff","#ffff55","#ffffff"],
  "ega 16": ["#000000","#0000aa","#00aa00","#00aaaa","#aa0000","#aa00aa","#aa5500","#aaaaaa",
             "#555555","#5555ff","#55ff55","#55ffff","#ff5555","#ff55ff","#ffff55","#ffffff"],
  "zx spectrum": ["#000000","#0000d7","#d70000","#d700d7","#00d700","#00d7d7","#d7d700","#d7d7d7",
                  "#0000ff","#ff0000","#ff00ff","#00ff00","#00ffff","#ffff00","#ffffff"],
  "c64": ["#000000","#ffffff","#813338","#75cec8","#8e3c97","#56ac4d","#2e2c9b","#edf171",
          "#8e5029","#553800","#c46c71","#4a4a4a","#7b7b7b","#a9ff9f","#706deb","#b2b2b2"],
  "nes": ["#000000","#fcfcfc","#f8f8f8","#bcbcbc","#7c7c7c","#a4e4fc","#3cbcfc","#0078f8","#0000fc",
          "#b8b8f8","#6888fc","#0058f8","#0000bc","#d8b8f8","#9878f8","#6844fc","#4428bc",
          "#f8b8f8","#f878f8","#d800cc","#940084","#f8a4c0","#f85898","#e40058","#a80020",
          "#f0d0b0","#f87858","#f83800","#a81000","#fce0a8","#fca044","#e45c10","#881400",
          "#f8d878","#f8b800","#ac7c00","#503000","#d8f878","#b8f818","#00b800","#007800",
          "#b8f8b8","#58d854","#00a800","#006800","#b8f8d8","#58f898","#00a844","#005800",
          "#00fcfc","#00e8d8","#008888","#004058","#f8d8f8","#787878"],
  "pico-8": ["#000000","#1d2b53","#7e2553","#008751","#ab5236","#5f574f","#c2c3c7","#fff1e8",
             "#ff004d","#ffa300","#ffec27","#00e436","#29adff","#83769c","#ff77a8","#ffccaa"],
  "master system": ["#000000","#550000","#aa0000","#ff0000","#005500","#555500","#aa5500","#ff5500",
                    "#00aa00","#55aa00","#aaaa00","#ffaa00","#00ff00","#55ff00","#aaff00","#ffff00",
                    "#0000aa","#5500aa","#aa00aa","#ff00aa","#0055ff","#5555ff","#aaaaff","#ffffff"],
  "apple ii": ["#000000","#6c2940","#404c9c","#d43e9d","#0f7e33","#7c7c7c","#1cc7ef","#bfd3fc",
               "#3f5a1b","#ef7e1c","#bfbfbf","#fca7c3","#37e12b","#d1e08b","#8ce4c2","#ffffff"],
  "teletext": ["#000000","#ff0000","#00ff00","#ffff00","#0000ff","#ff00ff","#00ffff","#ffffff"],
  "1-bit": ["#000000","#ffffff"],
  "auto (from frame)": null
};

// panel: L (left) or R (right). show: predicate for conditional visibility.
const SCHEMA = [
["OUTPUT","L",[
  {k:"outW",   t:"range", l:"width",      min:256, max:3840, step:32, d:1280, fmt:v=>v+"px"},
  {k:"fit",    t:"sel",   l:"fit",        opts:["cover","contain","stretch"], d:"cover"},
  {k:"arMode", t:"sel",   l:"aspect",     opts:["source","16:9","9:16","4:3","1:1","2.39:1"], d:"source"},
  {k:"scale",  t:"range", l:"pixel size", min:1, max:24, step:1, d:4, fmt:v=>v+"×"},
  {k:"fps",    t:"sel",   l:"frame rate", opts:["8","12","15","24","25","30","60"], d:"24"},
]],
["IMAGE","L",[
  {k:"bright", t:"range", l:"brightness", min:-1, max:1,  step:.01, d:0},
  {k:"contr",  t:"range", l:"contrast",   min:-1, max:1,  step:.01, d:.15},
  {k:"gamma",  t:"range", l:"gamma",      min:.2, max:3,  step:.01, d:1},
  {k:"black",  t:"range", l:"black pt",   min:0,  max:1,  step:.01, d:0},
  {k:"white",  t:"range", l:"white pt",   min:0,  max:1,  step:.01, d:1},
  {k:"blur",   t:"range", l:"blur",       min:0,  max:6,  step:.1,  d:0},
  {k:"sharp",  t:"range", l:"sharpen",    min:0,  max:2,  step:.05, d:0},
  {k:"edge",   t:"range", l:"edges",      min:0,  max:1,  step:.01, d:0},
  {k:"edgeOnly",t:"bool", l:"edges only", d:false},
  {k:"sat",    t:"range", l:"saturation", min:0,  max:2,  step:.01, d:1},
  {k:"poster", t:"range", l:"posterize",  min:0,  max:16, step:1,   d:0, fmt:v=>v==0?"off":v},
  {k:"invert", t:"bool",  l:"invert",     d:false},
]],
["RENDER","L",[
  {k:"mode",   t:"sel",   l:"mode", opts:["dither","8-bit","lcd","riso","ascii","halftone","stipple","contour","threshold","grayscale"], d:"dither"},

  {k:"algo",   t:"sel",   l:"algorithm", d:"floyd-steinberg", show:p=>p.mode==="dither"||p.mode==="riso",
    opts:["floyd-steinberg","atkinson","jarvis","stucki","burkes","sierra","sierra-2","sierra-lite",
          "bayer 2×2","bayer 4×4","bayer 8×8","clustered 4×4","clustered 8×8","blue noise","white noise","halftone dot"]},
  {k:"dLevels",t:"range", l:"tones",     min:2, max:8, step:1, d:2, show:p=>p.mode==="dither"},
  {k:"dThresh",t:"range", l:"threshold", min:0, max:1, step:.01, d:.5, show:p=>p.mode==="dither"||p.mode==="threshold"||p.mode==="riso"},
  {k:"dAmt",   t:"range", l:"diffusion", min:0, max:1, step:.01, d:1, show:p=>p.mode==="dither"||p.mode==="riso"},
  {k:"serp",   t:"bool",  l:"serpentine",d:true, show:p=>p.mode==="dither"||p.mode==="riso"},

  {k:"charset",t:"sel",   l:"charset", opts:Object.keys(CHARSETS), d:"shades 10", show:p=>p.mode==="ascii"},
  {k:"custom", t:"text",  l:"chars",   d:" .:-=+*#%@", show:p=>p.mode==="ascii"&&p.charset==="custom"},
  {k:"cols",   t:"range", l:"columns", min:16, max:400, step:1, d:120, show:p=>p.mode==="ascii"},
  {k:"cellAR", t:"range", l:"cell ratio", min:1, max:3, step:.05, d:1.9, show:p=>p.mode==="ascii"},
  {k:"fScale", t:"range", l:"glyph size", min:.5, max:1.6, step:.01, d:1.05, show:p=>p.mode==="ascii"},
  {k:"font",   t:"sel",   l:"font", opts:Object.keys(FONTS), d:"system mono", show:p=>p.mode==="ascii"},
  {k:"bold",   t:"bool",  l:"bold", d:false, show:p=>p.mode==="ascii"},
  {k:"rampInv",t:"bool",  l:"flip ramp", d:false, show:p=>p.mode==="ascii"},
  {k:"aDither",t:"sel",   l:"glyph dither", opts:["none","bayer 4×4","bayer 8×8","blue noise","noise"], d:"none", show:p=>p.mode==="ascii"},
  {k:"aMatch", t:"bool",  l:"shape match", d:false, show:p=>p.mode==="ascii"},
  {k:"aMatchW",t:"range", l:"match weight", min:0, max:1, step:.05, d:.75, show:p=>p.mode==="ascii"&&p.aMatch},
  {k:"aEdge",  t:"bool",  l:"edge glyphs", d:false, show:p=>p.mode==="ascii"},
  {k:"aEdgeT", t:"range", l:"edge amount", min:0, max:1, step:.01, d:.35, show:p=>p.mode==="ascii"&&p.aEdge},
  {k:"aColor", t:"sel",   l:"glyph color", opts:["ink","sample source","duotone"], d:"ink", show:p=>p.mode==="ascii"},

  {k:"htShape",t:"sel",   l:"shape", opts:["dot","square","diamond","line","cross","ring","triangle"], d:"dot", show:p=>p.mode==="halftone"},
  {k:"htCell", t:"range", l:"cell",  min:2, max:60, step:1, d:9,  show:p=>p.mode==="halftone"},
  {k:"htAngle",t:"range", l:"angle", min:0, max:90, step:1, d:45, show:p=>p.mode==="halftone"},

/* ------------------------------------------------------------ parameters */
const P = {};
const META = {};
SCHEMA.forEach(([g,panel,items])=>items.forEach(it=>{ P[it.k]=it.d; META[it.k]=it; }));
P.maskRects = [];                 // [{x,y,w,h}] in 0..1 of the output frame
P.pxLock = null;                  // frozen auto palette, as hex strings
P.smearLines = [];                // [{o:"v",x,y0,y1} | {o:"h",y,x0,x1}] in 0..1 of the frame
const DEFAULTS = JSON.parse(JSON.stringify(P));

/* ------------------------------------------------------------- UI build */
const $ = s=>document.querySelector(s);
const ctrls = {};      // key -> {row, input, valEl, meta}
const groupEls = [];

function buildUI(){
  SCHEMA.forEach(([name,panel,items])=>{
    const host = panel==="R" ? $("#panelR") : $("#panelL");
    const g = document.createElement("div"); g.className="group"; g.dataset.name=name;
    const h = document.createElement("h3"); h.textContent=name;
    const body = document.createElement("div"); body.className="gbody";
    h.onclick = ()=>g.classList.toggle("collapsed");
    g.append(h,body); host.append(g); groupEls.push(g);
    items.forEach(it=>body.append(makeRow(it)));
  });
  buildPalettes();
  buildPixelTools();
  buildMaskTools();
  buildSmearTools();
  buildPresetPanel();
  buildHelpPanel();
  syncVisibility();
}

function makeRow(it){
  const row = document.createElement("div");
  row.className = "row" + (it.t==="sel"||it.t==="text"||it.t==="color"||it.t==="bool" ? " wide":"");
  const lab = document.createElement("label"); lab.textContent = it.l; lab.title = it.k;
  row.append(lab);
  let input, valEl=null;

  if(it.t==="range"){
    input = document.createElement("input"); input.type="range";
    input.min=it.min; input.max=it.max; input.step=it.step; input.value=it.d;
    valEl = document.createElement("span"); valEl.className="val";
    input.addEventListener("input",()=>setParam(it.k, parseFloat(input.value)));
    // double-click a label resets that control
    lab.ondblclick = ()=>{ input.value = it.d; setParam(it.k, it.d); };
  } else if(it.t==="sel"){
    input = document.createElement("select");
    it.opts.forEach(o=>{ const op=document.createElement("option"); op.value=o; op.textContent=o; input.append(op); });
    input.value = it.d;
    input.addEventListener("change",()=>setParam(it.k, input.value));
  } else if(it.t==="bool"){
    const w=document.createElement("label"); w.className="chk";
    input=document.createElement("input"); input.type="checkbox"; input.checked=!!it.d;
    const t=document.createElement("span"); t.style.color="var(--dimmer)"; t.textContent="on";
    w.append(input,t);
    input.addEventListener("change",()=>setParam(it.k, input.checked));
    row.append(w); ctrls[it.k]={row,input,valEl,meta:it}; return row;
  } else if(it.t==="color"){
    input=document.createElement("input"); input.type="color"; input.value=it.d;
    input.addEventListener("input",()=>setParam(it.k, input.value));
  } else { // text
    input=document.createElement("input"); input.type="text"; input.value=it.d;
    input.addEventListener("input",()=>setParam(it.k, input.value));
  }
  row.append(input); if(valEl) row.append(valEl);
  ctrls[it.k]={row,input,valEl,meta:it};
  return row;
}

function setParam(k,v){
  P[k]=v;
  if(k==="rzSet" && RISO_SETS[v]){
    const set=RISO_SETS[v];
    P.rzInk1=set[0]; P.rzInk2=set[1]; P.rzInk3=set[2];
    ["rzInk1","rzInk2","rzInk3"].forEach(refreshControl);
  }
  if(/^rzInk[1-4]$/.test(k)) P.rzSet="custom", refreshControl("rzSet");
  if(k==="lcdSet" && LCD_SETS[v]){
    [P.lcdScreen,P.lcdInk,P.lcdGlowCol]=LCD_SETS[v];
    ["lcdScreen","lcdInk","lcdGlowCol"].forEach(refreshControl);
  }
  if(k==="lcdScreen"||k==="lcdInk"||k==="lcdGlowCol"){ P.lcdSet="custom"; refreshControl("lcdSet"); }
  // riso prints ink on paper: a black sheet under a multiply blend is just black
  if(k==="mode" && v==="riso" && isDark(P.paper) && P.rzBlend==="multiply"){
    P.paper="#f4f1e8"; refreshControl("paper"); markDirty("paper"); markPalette();
  }
  refreshControl(k); syncVisibility(); markDirty(k);
  if(k==="ink"||k==="paper") markPalette();
  requestRender();
}
const isDark = hex=>{ const [r,g,b]=hex2rgb(hex); return (0.2126*r+0.7152*g+0.0722*b)<40; };
function refreshControl(k){
  const c=ctrls[k]; if(!c) return;
  const it=c.meta;
  if(it.t==="range"){ c.input.value=P[k]; c.valEl.textContent = it.fmt?it.fmt(P[k]):fmtNum(P[k]); }
  else if(it.t==="bool") c.input.checked=!!P[k];
  else c.input.value=P[k];
}
function fmtNum(v){ return Math.abs(v)>=100?String(Math.round(v)) : (Math.round(v*100)/100).toString(); }
function markDirty(k){
  const c=ctrls[k]; if(!c) return;
  c.row.classList.toggle("dirty", JSON.stringify(P[k])!==JSON.stringify(DEFAULTS[k]));
}
function syncVisibility(){
  if(typeof updatePxLock==="function") updatePxLock();
  Object.keys(ctrls).forEach(k=>{
    const it=ctrls[k].meta;
    ctrls[k].row.style.display = (it.show && !it.show(P)) ? "none" : "";
  });
  groupEls.forEach(g=>{
    const rows=[...g.querySelectorAll(".row")];
    if(rows.length) g.style.display = rows.every(r=>r.style.display==="none") ? "none" : "";
  });
}
function refreshAll(){ Object.keys(ctrls).forEach(k=>{refreshControl(k);markDirty(k);}); syncVisibility(); markPalette(); }

  "blue backlight" : ["#5f9fd6","#0c1a2a","#a9d6ff"],
  "amber"          : ["#d99a2b","#2a1604","#ffd27a"]
};

/* Classic Risograph spot inks (Riso's own drum colours). */
const RISO_SETS = {
  "pink · blue · yellow"   : ["#ff48b0","#0078bf","#ffe800"],
  "red · blue · yellow"    : ["#ff665e","#0078bf","#ffe800"],

function fmtTC(s){
  if(!isFinite(s)) s=0;
  const m=Math.floor(s/60), sec=Math.floor(s%60), cs=Math.floor((s%1)*100);
  return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(cs).padStart(2,"0");
}

let currentFile=null;
async function loadFile(file){
  stopCam();
  currentFile=file;
  const url = URL.createObjectURL(file);
  video.srcObject=null; video.src=url; video.muted=true; video.loop=false;
  isCam=false;
  await new Promise(res=>{ video.onloadedmetadata=res; });
  srcReady=true; inPoint=0; outPoint=video.duration||0;
  $("#drop").classList.add("hide");
  $("#srcinfo").textContent = `${file.name} · ${video.videoWidth}×${video.videoHeight} · ${fmtTC(video.duration)}`;
  updateTrimUI(); resizeOutput(); video.currentTime=0;
  requestRender();
}
async function startCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{width:1920,height:1080},audio:false});
  }catch(e){ alert("Camera unavailable: "+e.message); return; }
  video.src=""; video.srcObject=camStream; isCam=true; srcReady=true;
  await video.play();

  $("#srcinfo").textContent = `webcam · ${video.videoWidth}×${video.videoHeight}`;

}

let outW=1280, outH=720;
function targetAspect(){
  switch(P.arMode){
    case "16:9": return 16/9; case "9:16": return 9/16; case "4:3": return 4/3;
    case "1:1": return 1; case "2.39:1": return 2.39;
    default: return (video.videoWidth&&video.videoHeight) ? video.videoWidth/video.videoHeight : 16/9;
  }
}
function resizeOutput(){
  outW = Math.max(16, Math.round(P.outW/2)*2);
  outH = Math.max(16, Math.round(outW/targetAspect()/2)*2);
  if(out.width!==outW||out.height!==outH){ out.width=outW; out.height=outH; }
}

const work = document.createElement("canvas");
const wctx = work.getContext("2d",{willReadFrequently:true});
const small = document.createElement("canvas");          // grid-resolution paint target
const sctx = small.getContext("2d",{willReadFrequently:false});
const tmp = document.createElement("canvas");
const tctx = tmp.getContext("2d");

let L=null, E=null, EA=null, gw=0, gh=0;                 // luma, edge magnitude, edge angle
let RGB=null;                                            // grid rgb (for "sample source")

/* ---- ordered matrices -------------------------------------------------- */
function bayer(n){
  if(n===1) return [[0]];
  const p = bayer(n/2), m=[];
  for(let y=0;y<n;y++){ m[y]=[]; for(let x=0;x<n;x++){
    const q=p[y%(n/2)][x%(n/2)]*4;
    m[y][x]= q + (y<n/2 ? (x<n/2?0:2) : (x<n/2?3:1));
  }}
  return m;
}
function normMat(m){
  const n=m.length, o=new Float32Array(n*n);
  let mx=0; for(let y=0;y<n;y++)for(let x=0;x<n;x++) mx=Math.max(mx,m[y][x]);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++) o[y*n+x]=(m[y][x]+.5)/(mx+1);
  return {n,d:o};
}
const MAT = {
  "bayer 2×2": normMat(bayer(2)),
  "bayer 4×4": normMat(bayer(4)),
  "bayer 8×8": normMat(bayer(8)),
  "clustered 4×4": normMat([[12,5,6,13],[4,0,1,7],[11,3,2,8],[15,10,9,14]]),
  "clustered 8×8": normMat([
    [24,10,12,26,35,47,49,37],[8,0,2,14,45,59,61,51],[22,6,4,16,43,57,63,53],[30,20,18,28,33,41,55,39],
    [34,46,48,36,25,11,13,27],[44,58,60,50,9,1,3,15],[42,56,62,52,23,7,5,17],[32,40,54,38,31,21,19,29]]),
  "halftone dot": normMat([
    [13,5,12,16,21,29,22,18],[6,0,4,20,28,36,30,24],[14,1,3,25,35,39,34,27],[17,9,10,31,38,37,33,23],
    [21,29,22,18,13,5,12,16],[28,36,30,24,6,0,4,20],[35,39,34,27,14,1,3,25],[38,37,33,23,17,9,10,31]])
};
/* blue noise: white noise, high-passed, then rank-ordered (fast approximation) */
const BLUE = (()=>{
  const n=64, N=n*n, a=new Float32Array(N);
  for(let i=0;i<N;i++) a[i]=Math.random();
  const b=new Float32Array(N), hp=new Float32Array(N);
  for(let pass=0;pass<3;pass++){
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      let s=0,c=0;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
        s+=a[(((y+dy)+n)%n)*n+((x+dx)+n)%n]; c++;
      }
      b[y*n+x]=s/c;
    }
    for(let i=0;i<N;i++) a[i]= a[i] + (a[i]-b[i])*0.8;
  }
  for(let i=0;i<N;i++) hp[i]=a[i];
  const idx=Array.from({length:N},(_,i)=>i).sort((p,q)=>hp[p]-hp[q]);
  const d=new Float32Array(N);
  idx.forEach((id,rank)=>d[id]=(rank+.5)/N);
  return {n,d};
})();
function matrixFor(name){ return name==="blue noise"?BLUE:(MAT[name]||MAT["bayer 4×4"]); }

/* ---- sample the video into the working grid ---------------------------- */
function drawSource(ctx,w,h){
  // The grid may be anisotropic (ASCII cells are taller than wide), so the fit
  // is solved in output space and then scaled into the grid.
  const vw=video.videoWidth||16, vh=video.videoHeight||9;
  const kx=w/outW, ky=h/outH;
  ctx.save();
  ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h);
  let dw=outW, dh=outH;
  if(P.fit!=="stretch"){
    const sa=vw/vh, da=outW/outH;
    if((P.fit==="cover")===(sa>da)){ dh=outH; dw=outH*sa; } else { dw=outW; dh=outW/sa; }
  }
  ctx.drawImage(video,(outW-dw)/2*kx,(outH-dh)/2*ky,dw*kx,dh*ky);
  ctx.restore();
}

/* ---- build luma grid + adjustments ------------------------------------- */
function buildLuma(w,h,needRGB){
  rgbLive=!!needRGB;
  if(work.width!==w||work.height!==h){ work.width=w; work.height=h; }
  drawSource(wctx,w,h);
  const img = wctx.getImageData(0,0,w,h).data;
  const N=w*h;
  if(!L||L.length!==N){ L=new Float32Array(N); E=new Float32Array(N); EA=new Float32Array(N); }
  if(needRGB && (!RGB||RGB.length!==N*3)) RGB=new Float32Array(N*3);

  const bl=P.black, wh=Math.max(P.black+.001,P.white), inv=1/(wh-bl);
  const c = P.contr, cf = c>=0 ? 1+c*2.2 : 1+c*0.95;
  const g = 1/P.gamma, br=P.bright, po=P.poster|0;
  // the same tone chain is applied per channel, so colour modes respond to the
  // IMAGE panel exactly as the mono ones do
  const tone = v=>{
    v=(v-bl)*inv + br;
    v=(v-.5)*cf+.5;
    v=v<0?0:v>1?1:v;
    if(g!==1) v=Math.pow(v,g);
    if(po>1) v=Math.round(v*(po-1))/(po-1);
    if(P.invert) v=1-v;
    return v<0?0:v>1?1:v;
  };
  const sat=P.sat;

  for(let i=0,j=0;i<N;i++,j+=4){
    const r=img[j], gr=img[j+1], b=img[j+2];
    if(needRGB){
      let R=tone(r/255), G=tone(gr/255), B=tone(b/255);
      if(sat!==1){
        const y=0.2126*R+0.7152*G+0.0722*B;
        R=clamp(y+(R-y)*sat,0,1); G=clamp(y+(G-y)*sat,0,1); B=clamp(y+(B-y)*sat,0,1);
      }
      RGB[i*3]=R*255; RGB[i*3+1]=G*255; RGB[i*3+2]=B*255;
    }
    let v=(0.2126*r+0.7152*gr+0.0722*b)/255;
    v=(v-bl)*inv;                    // levels
    v=v+br;                          // brightness
    v=(v-.5)*cf+.5;                  // contrast
    v=v<0?0:v>1?1:v;
    if(g!==1) v=Math.pow(v,g);       // gamma
    if(po>1) v=Math.round(v*(po-1))/(po-1);
    if(P.invert) v=1-v;
    L[i]=v;
  }
  gw=w; gh=h;
  if(P.blur>0) boxBlur(L,w,h,P.blur);
  if(P.sharp>0) unsharp(L,w,h,P.sharp);
  if(P.edge>0||P.edgeOnly||(P.mode==="ascii"&&P.aEdge)) sobel(L,w,h);
  if(P.edgeOnly){ for(let i=0;i<N;i++) L[i]=Math.min(1,E[i]*(0.5+P.edge*2)); }
  else if(P.edge>0){ for(let i=0;i<N;i++) L[i]=clamp(L[i]*(1-P.edge*0.55)+E[i]*P.edge*1.2,0,1); }
  summariseLuma();
  applyWarp(w,h);
  timeDisplace(w,h);
  gridLineSmear(w,h);
}

/* ----------------------------------------------------------------------
   Time displacement (slit-scan). A ring of recent luma grids lets each part
   of the frame be sampled from a different moment. Playback and export both
   render in order, so the ring fills naturally; exports pre-roll it first.
   ---------------------------------------------------------------------- */
let ring=[], ringW=0, ringH=0;
function ringReset(){ ring=[]; ringC=[]; ringW=ringH=0; }
let ringC=[];
function ringPush(w,h){
  if(w!==ringW||h!==ringH){ ring=[]; ringC=[]; ringW=w; ringH=h; }
  ring.push(Float32Array.from(L));
  if(rgbLive && RGB){                       // colour history, 8-bit to keep it small
    const c=new Uint8ClampedArray(RGB.length);
    for(let i=0;i<RGB.length;i++) c[i]=RGB[i];
    ringC.push(c);
  } else ringC.push(null);
  const cap=Math.max(2,(P.tdDepth|0)+2);
  while(ring.length>cap){ ring.shift(); ringC.shift(); }
}
function timeDisplace(w,h){
  if(P.tdMode==="off"){ if(ring.length) ringReset(); return; }
  ringPush(w,h);
  const n=ring.length;
  if(n<2) return;
  const depth=Math.min(n-1,P.tdDepth|0);
  const rev=P.tdDir==="reverse";
  const cx=w/2, cy=h/2, maxR=Math.hypot(cx,cy);
  const mix=P.tdMix;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=y*w+x;
      let f;                                     // 0 = now, 1 = oldest
      switch(P.tdMode){
        case "columns": f=x/(w-1); break;
        case "radial":  f=Math.hypot(x-cx,y-cy)/maxR; break;
        case "luma":    f=1-L[i]; break;
        default:        f=y/(h-1);
      }
      if(rev) f=1-f;
      const age=Math.min(depth,Math.round(f*depth));
      if(!age) continue;
      const slot=n-1-age, past=ring[slot];
      if(past) L[i]= mix>=1 ? past[i] : L[i]*(1-mix)+past[i]*mix;
      const pastC=ringC[slot];
      if(pastC && rgbLive && RGB){
        for(let c=0;c<3;c++)
          RGB[i*3+c] = mix>=1 ? pastC[i*3+c] : RGB[i*3+c]*(1-mix)+pastC[i*3+c]*mix;
      }
    }
  }
}

/* Cheap fingerprint of the decoded frame, taken before warping so that animated
   effects cannot disguise a stale grab. Drives the export's frame-ready check. */
let lumaSig="", lumaFlat=false;
function summariseLuma(){
  let mn=1,mx=0,sum=0,wsum=0;
  const step=Math.max(1,(L.length/1024)|0);
  for(let i=0;i<L.length;i+=step){
    const v=L[i];
    if(v<mn) mn=v; if(v>mx) mx=v;
    sum+=v; wsum+=v*((i%13)+1);
  }
  lumaFlat = (mx-mn)<0.008;
  lumaSig  = sum.toFixed(4)+"|"+wsum.toFixed(4);
}

function boxBlur(src,w,h,radius){
  const r=Math.max(1,Math.round(radius)); const t=new Float32Array(src.length);
  for(let y=0;y<h;y++){ let s=0;
    for(let x=-r;x<=r;x++) s+=src[y*w+clamp(x,0,w-1)];
    for(let x=0;x<w;x++){ t[y*w+x]=s/(2*r+1);
      s+=src[y*w+clamp(x+r+1,0,w-1)]-src[y*w+clamp(x-r,0,w-1)]; }
  }
  for(let x=0;x<w;x++){ let s=0;
    for(let y=-r;y<=r;y++) s+=t[clamp(y,0,h-1)*w+x];
    for(let y=0;y<h;y++){ src[y*w+x]=s/(2*r+1);
      s+=t[clamp(y+r+1,0,h-1)*w+x]-t[clamp(y-r,0,h-1)*w+x]; }
  }
}
function unsharp(src,w,h,amt){
  const b=Float32Array.from(src); boxBlur(b,w,h,1);
  for(let i=0;i<src.length;i++) src[i]=clamp(src[i]+(src[i]-b[i])*amt*2.2,0,1);
}
function sobel(src,w,h){
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;
    const x0=clamp(x-1,0,w-1), x1=clamp(x+1,0,w-1), y0=clamp(y-1,0,h-1)*w, y1=clamp(y+1,0,h-1)*w, yc=y*w;
    const tl=src[y0+x0],tc=src[y0+x],tr=src[y0+x1],
          ml=src[yc+x0],mr=src[yc+x1],
          bl=src[y1+x0],bc=src[y1+x],br=src[y1+x1];
    const gx=(tr+2*mr+br)-(tl+2*ml+bl);
    const gy=(bl+2*bc+br)-(tl+2*tc+tr);
    E[i]=Math.min(1,Math.hypot(gx,gy));
    EA[i]=Math.atan2(gy,gx);
  }
}

/* ---- warp (wave / ripple / glitch) in luma space ------------------------ */
let warpBuf=null, warpRGB=null, rgbLive=false;
function applyWarp(w,h){
  const t=renderTime;
  const px = w/outW;                                   // grid px per output px
  const wa=P.wAmp*px, ra=P.rAmp*px, ja=P.jAmp*px;
  if(wa<=0 && ra<=0 && ja<=0) return;
  if(!warpBuf||warpBuf.length!==L.length) warpBuf=new Float32Array(L.length);
  warpBuf.set(L);
  const doRGB = rgbLive && RGB && RGB.length===L.length*3;
  if(doRGB){
    if(!warpRGB||warpRGB.length!==RGB.length) warpRGB=new Float32Array(RGB.length);
    warpRGB.set(RGB);
  }
  const wl=Math.max(1,P.wLen*px), rl=Math.max(1,P.rLen*px);
  const cx=w/2, cy=h/2;
  const jSeedRow = y=>{
    const band=Math.max(1,P.jSize*px);
    const b=Math.floor(y/band), tick=Math.floor(t*P.jRate);
    const s=Math.sin(b*127.1+tick*311.7)*43758.5453;
    return (s-Math.floor(s))*2-1;
  };
  for(let y=0;y<h;y++){
    const jx = ja>0 ? jSeedRow(y)*ja*(Math.abs(jSeedRow(y))>0.55?1:0) : 0;
    for(let x=0;x<w;x++){
      let sx=x, sy=y;
      if(wa>0){
        if(P.wAxis==="horizontal"||P.wAxis==="both") sx += Math.sin((y/wl)*6.2831 + t*P.wSpd*3)*wa;
        if(P.wAxis==="vertical"||P.wAxis==="both")   sy += Math.sin((x/wl)*6.2831 + t*P.wSpd*3)*wa;
        if(P.wAxis==="radial"){
          const dx=x-cx, dy=y-cy, a=Math.atan2(dy,dx);
          const d=Math.sin((Math.hypot(dx,dy)/wl)*6.2831 - t*P.wSpd*3)*wa;
          sx=x+Math.cos(a)*d; sy=y+Math.sin(a)*d;
        }
      }
      if(ra>0){
        const dx=x-cx, dy=y-cy, dist=Math.hypot(dx,dy)||1;
        const d=Math.sin((dist/rl)*6.2831 - t*P.rSpd*3)*ra;
        sx+=dx/dist*d; sy+=dy/dist*d;
      }
      sx+=jx;
      const di=y*w+x;
      L[di]=sampleBil(warpBuf,w,h,sx,sy);
      if(doRGB){
        RGB[di*3]  =sampleBil3(warpRGB,w,h,sx,sy,0);
        RGB[di*3+1]=sampleBil3(warpRGB,w,h,sx,sy,1);
        RGB[di*3+2]=sampleBil3(warpRGB,w,h,sx,sy,2);
      }
    }
  }
}
function sampleBil3(a,w,h,x,y,c){
  x=clamp(x,0,w-1.001); y=clamp(y,0,h-1.001);
  const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,x1=Math.min(x0+1,w-1),y1=Math.min(y0+1,h-1);
  const i00=(y0*w+x0)*3+c, i01=(y0*w+x1)*3+c, i10=(y1*w+x0)*3+c, i11=(y1*w+x1)*3+c;
  return a[i00]*(1-fx)*(1-fy)+a[i01]*fx*(1-fy)+a[i10]*(1-fx)*fy+a[i11]*fx*fy;
}
function sampleBil(a,w,h,x,y){
  x=clamp(x,0,w-1.001); y=clamp(y,0,h-1.001);
  const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,x1=Math.min(x0+1,w-1),y1=Math.min(y0+1,h-1);
  return a[y0*w+x0]*(1-fx)*(1-fy)+a[y0*w+x1]*fx*(1-fy)+a[y1*w+x0]*(1-fx)*fy+a[y1*w+x1]*fx*fy;
}
