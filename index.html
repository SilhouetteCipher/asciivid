/* ======================================================================
   SMEAR LINES
   Draw a line on the canvas and every pixel along it is dragged out across the
   frame — the stuck-row streak you get when a datamosh loses its motion data.
   A mostly-vertical drag makes a vertical line that bleeds sideways; a mostly-
   horizontal drag makes a horizontal one that bleeds up or down.
   ====================================================================== */
const BLOCK_HINT="drag to add · centre handle moves · corners resize · ⌫ or double-click removes · esc to finish";
const LINE_HINT ="drag down for a vertical line, sideways for a horizontal one · drag a line to move it · ends resize · ⌫ or double-click removes · esc to finish";
const LMIN=.02;

function smearHash(a,b,c){ const v=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453; return v-Math.floor(v); }
function smearDirs(){ return P.smDir==="both ways" ? [1,-1] : P.smDir==="left / up" ? [-1] : [1]; }

function linePts(l,W,H){
  if(l.o==="v") return {a:[l.x*W,l.y0*H], b:[l.x*W,l.y1*H], c:[l.x*W,(l.y0+l.y1)/2*H]};
  return {a:[l.x0*W,l.y*H], b:[l.x1*W,l.y*H], c:[(l.x0+l.x1)/2*W,l.y*H]};
}
function lineHit(px,py,W,H){
  const ls=P.smearLines;
  for(let i=ls.length-1;i>=0;i--){
    const pts=linePts(ls[i],W,H);
    for(const k of ["a","b","c"]){
      const [hx,hy]=pts[k];
      if(Math.abs(px-hx)<=HIT && Math.abs(py-hy)<=HIT) return {idx:i,handle:k};
    }
  }
  for(let i=ls.length-1;i>=0;i--){                      // grabbing the line itself
    const l=ls[i];
    if(l.o==="v"){ if(Math.abs(px-l.x*W)<=7 && py>=l.y0*H-7 && py<=l.y1*H+7) return {idx:i,handle:"c"}; }
    else          { if(Math.abs(py-l.y*H)<=7 && px>=l.x0*W-7 && px<=l.x1*W+7) return {idx:i,handle:"c"}; }
  }
  return null;
}

function drawLinesOverlay(W,H){
  const dirs=smearDirs();
  const all=P.smearLines.concat(dragLine?[dragLine]:[]);
  all.forEach((l,i)=>{
    const isDrag = l===dragLine;
    const active = !isDrag && i===lineSel;
    const pts=linePts(l,W,H);
    // show which way this line will bleed
    const reach=Math.min(90,(l.o==="v"?W:H)*.18);
    for(const d of dirs){
      if(l.o==="v"){
        const x=pts.a[0], x2=x+d*reach, g=mlx.createLinearGradient(x,0,x2,0);
        g.addColorStop(0,"rgba(255,91,31,.3)"); g.addColorStop(1,"rgba(255,91,31,0)");
        mlx.fillStyle=g; mlx.fillRect(Math.min(x,x2),pts.a[1],reach,pts.b[1]-pts.a[1]);
      } else {
        const y=pts.a[1], y2=y+d*reach, g=mlx.createLinearGradient(0,y,0,y2);
        g.addColorStop(0,"rgba(255,91,31,.3)"); g.addColorStop(1,"rgba(255,91,31,0)");
        mlx.fillStyle=g; mlx.fillRect(pts.a[0],Math.min(y,y2),pts.b[0]-pts.a[0],reach);
      }
    }
    mlx.setLineDash(isDrag?[4,3]:[]);
    mlx.strokeStyle="#ff5b1f"; mlx.lineWidth=active?3:2;
    mlx.beginPath(); mlx.moveTo(pts.a[0],pts.a[1]); mlx.lineTo(pts.b[0],pts.b[1]); mlx.stroke();
    mlx.setLineDash([]);
    if(isDrag) return;
    mlx.fillStyle="#ff5b1f"; mlx.font="10px ui-monospace,monospace";
    mlx.fillText(String(i+1),pts.a[0]+6,pts.a[1]+12);
    mlx.lineWidth=1;
    for(const k of ["a","b"]){
      const [hx,hy]=pts[k];
      const hov=lineHover&&lineHover.idx===i&&lineHover.handle===k;
      mlx.fillStyle=hov?"#fff":"#ff5b1f";
      mlx.fillRect(hx-HANDLE/2,hy-HANDLE/2,HANDLE,HANDLE);
      mlx.strokeStyle="#0b0b0c"; mlx.strokeRect(hx-HANDLE/2+.5,hy-HANDLE/2+.5,HANDLE-1,HANDLE-1);
    }
    const [cx,cy]=pts.c, hovC=lineHover&&lineHover.idx===i&&lineHover.handle==="c";
    mlx.fillStyle=hovC?"#fff":"#ff5b1f";
    mlx.beginPath(); mlx.arc(cx,cy,HANDLE*.7,0,6.2832); mlx.fill();
    mlx.strokeStyle="#0b0b0c"; mlx.lineWidth=1.5;
    mlx.beginPath(); mlx.moveTo(cx-4,cy); mlx.lineTo(cx+4,cy); mlx.moveTo(cx,cy-4); mlx.lineTo(cx,cy+4); mlx.stroke();
  });
}

function setDrawLines(on){
  if(on && drawingMask) setDrawMask(false);          // one drawing tool at a time
  drawingLines=on;
  $("#stage").classList.toggle("drawing",on);
  maskLayer.classList.toggle("on",on);
  maskLayer.style.cursor="crosshair";
  if(!on){ lineSel=-1; lineHover=null; lineDrag=null; lineStart=null; dragLine=null; }
  if(on){ P.smOn=true; $("#maskhint").textContent=LINE_HINT; }
  refreshControl("smOn"); markDirty("smOn"); syncVisibility();
  const b=$("#btnDrawLines"); if(b){ b.classList.toggle("on",on); b.textContent=on?"Finish lines":"Draw lines"; }
  requestRender(); drawMaskOverlay();
}

maskLayer.addEventListener("pointerdown",e=>{
  if(!drawingLines) return;
  if(maskLayer.setPointerCapture) maskLayer.setPointerCapture(e.pointerId);
  const p=toLocal(e), W=maskLayer.width, H=maskLayer.height;
  const hit=lineHit(p.x*W,p.y*H,W,H);
  lineStart=p; dragLine=null;
  if(hit){
    lineSel=hit.idx;
    lineDrag={handle:hit.handle, idx:hit.idx, start:p, orig:{...P.smearLines[hit.idx]}};
  } else { lineSel=-1; lineDrag=null; }
  drawMaskOverlay();
});
maskLayer.addEventListener("pointermove",e=>{
  if(!drawingLines) return;
  const p=toLocal(e), W=maskLayer.width, H=maskLayer.height;
  if(!lineStart){                                     // hover feedback
    const h=lineHit(p.x*W,p.y*H,W,H);
    const key=h?h.idx+h.handle:"", prev=lineHover?lineHover.idx+lineHover.handle:"";
    lineHover=h;
    maskLayer.style.cursor = !h ? "crosshair"
      : h.handle==="c" ? "move"
      : (P.smearLines[h.idx].o==="v" ? "ns-resize" : "ew-resize");
    if(key!==prev) drawMaskOverlay();
    return;
  }
  if(lineDrag){
    const o=lineDrag.orig, dx=p.x-lineDrag.start.x, dy=p.y-lineDrag.start.y, n={...o};
    if(lineDrag.handle==="c"){
      if(o.o==="v"){ const span=o.y1-o.y0; n.x=clamp(o.x+dx,0,1); n.y0=clamp(o.y0+dy,0,1-span); n.y1=n.y0+span; }
      else          { const span=o.x1-o.x0; n.y=clamp(o.y+dy,0,1); n.x0=clamp(o.x0+dx,0,1-span); n.x1=n.x0+span; }
    } else {                                          // an end slides along the line's own axis
      const v=o.o==="v";
      const lo=v?o.y0:o.x0, hi=v?o.y1:o.x1;
      const moving=clamp((lineDrag.handle==="a"?lo:hi)+(v?dy:dx),0,1);
      const fixed = lineDrag.handle==="a"?hi:lo;
      let a0=Math.min(moving,fixed), a1=Math.max(moving,fixed);
      if(a1-a0<LMIN){ const mid=(a0+a1)/2; a0=clamp(mid-LMIN/2,0,1-LMIN); a1=a0+LMIN; }
      if(v){ n.y0=a0; n.y1=a1; } else { n.x0=a0; n.x1=a1; }
    }
    P.smearLines[lineDrag.idx]=n;
    requestRender(); drawMaskOverlay();
    return;
  }
  const dx=p.x-lineStart.x, dy=p.y-lineStart.y;
  dragLine = Math.abs(dy)*H>=Math.abs(dx)*W
    ? {o:"v", x:lineStart.x, y0:Math.min(lineStart.y,p.y), y1:Math.max(lineStart.y,p.y)}
    : {o:"h", y:lineStart.y, x0:Math.min(lineStart.x,p.x), x1:Math.max(lineStart.x,p.x)};
  drawMaskOverlay();
});
maskLayer.addEventListener("pointerup",()=>{
  if(!drawingLines||!lineStart) return;
  if(lineDrag){ lineDrag=null; }
  else if(dragLine){
    const span = dragLine.o==="v" ? dragLine.y1-dragLine.y0 : dragLine.x1-dragLine.x0;
    if(span>=LMIN){ P.smearLines.push(dragLine); lineSel=P.smearLines.length-1; }
  }
  lineStart=null; dragLine=null;
  updateLineCount(); requestRender(); drawMaskOverlay();
});
maskLayer.addEventListener("dblclick",e=>{
  if(!drawingLines) return;
  const p=toLocal(e), W=maskLayer.width, H=maskLayer.height;
  const hit=lineHit(p.x*W,p.y*H,W,H);
  if(hit){ P.smearLines.splice(hit.idx,1); lineSel=-1; updateLineCount(); requestRender(); drawMaskOverlay(); }
});
function deleteSelectedLine(){
  if(!drawingLines||lineSel<0||lineSel>=P.smearLines.length) return false;
  P.smearLines.splice(lineSel,1); lineSel=-1;
  updateLineCount(); requestRender(); drawMaskOverlay();
  return true;
}
function updateLineCount(){
  const el=$("#lineCount"); if(!el) return;
  const n=P.smearLines.length;
  el.textContent = n ? `${n} line${n>1?"s":""}` : "no lines yet";
}
function buildSmearTools(){
  const body=document.querySelector('.group[data-name="SMEAR"] .gbody');
  if(!body) return;
  const bar=document.createElement("div"); bar.className="btnrow";
  const draw=document.createElement("button"); draw.className="mini"; draw.id="btnDrawLines"; draw.textContent="Draw lines";
  draw.onclick=()=>setDrawLines(!drawingLines);
  const full=document.createElement("button"); full.className="mini"; full.textContent="Full span";
  full.title="stretch the selected line (or the last one) edge to edge";
  full.onclick=()=>{
    const i = lineSel>=0 ? lineSel : P.smearLines.length-1;
    const l=P.smearLines[i]; if(!l) return;
    if(l.o==="v"){ l.y0=0; l.y1=1; } else { l.x0=0; l.x1=1; }
    requestRender(); drawMaskOverlay();
  };
  const clr=document.createElement("button"); clr.className="mini"; clr.textContent="Clear";
  clr.onclick=()=>{ P.smearLines=[]; lineSel=-1; updateLineCount(); requestRender(); drawMaskOverlay(); };
  bar.append(draw,full,clr);
  const count=document.createElement("p"); count.className="note"; count.id="lineCount";
  body.prepend(bar,count);

/* After the effect: streak the rendered frame itself. Each row band pulls one
   pixel from the line and stretches it out; ragged ends, sample wobble and a
   brightness gate break up the regularity, re-rolled at the flicker rate. */
const smearCv=document.createElement("canvas"), smctx=smearCv.getContext("2d");
const snapCv=document.createElement("canvas"), snctx=snapCv.getContext("2d");
function applyLineSmear(){
  if(!P.smOn || !P.smearLines.length || P.smStage!=="after effect" || P.smAmt<=0) return;
  if(snapCv.width!==outW||snapCv.height!==outH){ snapCv.width=outW; snapCv.height=outH; }
  if(smearCv.width!==outW||smearCv.height!==outH){ smearCv.width=outW; smearCv.height=outH; }
  snctx.globalCompositeOperation="source-over"; snctx.clearRect(0,0,outW,outH);
  snctx.drawImage(out,0,0);                           // streaks sample the frame as rendered
  const tick=Math.floor(renderTime*P.smRate), band=Math.max(1,P.smBand|0), dirs=smearDirs();
  const lumAt=(d,j)=>(0.2126*d[j]+0.7152*d[j+1]+0.0722*d[j+2])/255;
  P.smearLines.forEach((l,li)=>{
    smctx.globalCompositeOperation="source-over";
    smctx.clearRect(0,0,outW,outH);
    smctx.imageSmoothingEnabled=false;
    if(l.o==="v"){
      const xl=Math.round(clamp(l.x,0,1)*(outW-1));
      const ya=Math.max(0,Math.round(l.y0*outH)), yb=Math.min(outH,Math.round(l.y1*outH));
      if(yb<=ya) return;
      const gate=P.smGate>0 ? snctx.getImageData(xl,ya,1,yb-ya).data : null;
      for(let y=ya;y<yb;y+=band){
        const bi=Math.floor(y/band), r1=smearHash(bi,li,tick), r2=smearHash(bi,li+17,tick);
        if(gate && lumAt(gate,(y-ya)*4)<P.smGate) continue;
        const xs=clamp(xl+Math.round((r2-.5)*2*P.smWobble),0,outW-1), bh=Math.min(band,yb-y);
        for(const d of dirs){
          const room=d>0?outW-1-xl:xl;
          const len=Math.max(1,Math.round(room*P.smLen*(1-P.smJitter*r1)));
          smctx.drawImage(snapCv,xs,y,1,bh, d>0?xl+1:xl-len,y,len,bh);
        }
      }
      if(P.smDecay>0){
        smctx.globalCompositeOperation="destination-out";
        for(const d of dirs){
          const g=smctx.createLinearGradient(xl,0,d>0?outW:0,0);
          g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,`rgba(0,0,0,${P.smDecay})`);
          smctx.fillStyle=g;
          if(d>0) smctx.fillRect(xl,ya,outW-xl,yb-ya); else smctx.fillRect(0,ya,xl+1,yb-ya);
        }
      }
    } else {
      const yl=Math.round(clamp(l.y,0,1)*(outH-1));
      const xa=Math.max(0,Math.round(l.x0*outW)), xb=Math.min(outW,Math.round(l.x1*outW));
      if(xb<=xa) return;
      const gate=P.smGate>0 ? snctx.getImageData(xa,yl,xb-xa,1).data : null;
      for(let x=xa;x<xb;x+=band){
        const bi=Math.floor(x/band), r1=smearHash(bi,li,tick), r2=smearHash(bi,li+17,tick);
        if(gate && lumAt(gate,(x-xa)*4)<P.smGate) continue;
        const ys=clamp(yl+Math.round((r2-.5)*2*P.smWobble),0,outH-1), bw=Math.min(band,xb-x);
        for(const d of dirs){
          const room=d>0?outH-1-yl:yl;
          const len=Math.max(1,Math.round(room*P.smLen*(1-P.smJitter*r1)));
          smctx.drawImage(snapCv,x,ys,bw,1, x,d>0?yl+1:yl-len,bw,len);
        }
      }
      if(P.smDecay>0){
        smctx.globalCompositeOperation="destination-out";
        for(const d of dirs){
          const g=smctx.createLinearGradient(0,yl,0,d>0?outH:0);
          g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,`rgba(0,0,0,${P.smDecay})`);
          smctx.fillStyle=g;
          if(d>0) smctx.fillRect(xa,yl,xb-xa,outH-yl); else smctx.fillRect(xa,0,xb-xa,yl+1);
        }
      }
    }
    smctx.globalCompositeOperation="source-over";
    octx.save();
    octx.globalAlpha=P.smAmt;
    octx.globalCompositeOperation = P.smBlend==="add" ? "lighter" : P.smBlend==="screen" ? "screen" : "source-over";
    octx.drawImage(smearCv,0,0);
    octx.restore();
  });
}

/* Before the effect: smear the working grid instead, so the streaks are then
   dithered, typeset or printed along with everything else. */
function gridLineSmear(w,h){
  if(!P.smOn || !P.smearLines.length || P.smStage!=="before effect" || P.smAmt<=0) return;
  const tick=Math.floor(renderTime*P.smRate), dirs=smearDirs();
  const srcL=Float32Array.from(L);
  const srcC=(rgbLive&&RGB&&RGB.length===L.length*3) ? Float32Array.from(RGB) : null;
  const streak=(i,si,k,len)=>{
    const keep=P.smAmt*(1-P.smDecay*(k/len));
    L[i]=L[i]*(1-keep)+srcL[si]*keep;
    if(srcC) for(let c=0;c<3;c++) RGB[i*3+c]=RGB[i*3+c]*(1-keep)+srcC[si*3+c]*keep;
  };
  P.smearLines.forEach((l,li)=>{
    if(l.o==="v"){
      const band=Math.max(1,Math.round(P.smBand*h/outH)), wob=P.smWobble*w/outW;
      const xl=Math.round(clamp(l.x,0,1)*(w-1));
      const ya=Math.max(0,Math.floor(l.y0*h)), yb=Math.min(h,Math.ceil(l.y1*h));
      for(let y=ya;y<yb;y++){
        const bi=Math.floor(y/band), r1=smearHash(bi,li,tick), r2=smearHash(bi,li+17,tick);
        const xs=clamp(xl+Math.round((r2-.5)*2*wob),0,w-1), si=y*w+xs;
        if(P.smGate>0 && srcL[si]<P.smGate) continue;
        for(const d of dirs){
          const len=Math.max(1,Math.round((d>0?w-1-xl:xl)*P.smLen*(1-P.smJitter*r1)));
          for(let k=1;k<=len;k++){ const x=xl+d*k; if(x<0||x>=w) break; streak(y*w+x,si,k,len); }
        }
      }
    } else {
      const band=Math.max(1,Math.round(P.smBand*w/outW)), wob=P.smWobble*h/outH;
      const yl=Math.round(clamp(l.y,0,1)*(h-1));
      const xa=Math.max(0,Math.floor(l.x0*w)), xb=Math.min(w,Math.ceil(l.x1*w));
      for(let x=xa;x<xb;x++){
        const bi=Math.floor(x/band), r1=smearHash(bi,li,tick), r2=smearHash(bi,li+17,tick);
        const ys=clamp(yl+Math.round((r2-.5)*2*wob),0,h-1), si=ys*w+x;
        if(P.smGate>0 && srcL[si]<P.smGate) continue;
        for(const d of dirs){
          const len=Math.max(1,Math.round((d>0?h-1-yl:yl)*P.smLen*(1-P.smJitter*r1)));
          for(let k=1;k<=len;k++){ const y=yl+d*k; if(y<0||y>=h) break; streak(y*w+x,si,k,len); }
        }
      }
    }
  });
}

/* ======================================================================
   HIGHLIGHT BLEED
   Blown-out highlights drag a burning trail across the frame, as when an
   overdriven sensor or tape head smears bright light down the scan. A running
   decayed maximum along each row carries every highlight onward.
   ====================================================================== */
const hbSrcCv=document.createElement("canvas"), hbSrcCtx=hbSrcCv.getContext("2d",{willReadFrequently:true});
const hbOutCv=document.createElement("canvas"), hbOutCtx=hbOutCv.getContext("2d");
function applyHighlightBleed(){
  if(P.hbAmt<=0) return;
  const sc=Math.max(1,P.hbRes|0);
  const w=Math.max(2,Math.ceil(outW/sc)), h=Math.max(2,Math.ceil(outH/sc));
  if(hbSrcCv.width!==w||hbSrcCv.height!==h){ hbSrcCv.width=w; hbSrcCv.height=h; hbOutCv.width=w; hbOutCv.height=h; }
  if(P.hbFrom==="source") drawSource(hbSrcCtx,w,h);
  else { hbSrcCtx.imageSmoothingEnabled=true; hbSrcCtx.drawImage(out,0,0,w,h); }
  const src=hbSrcCtx.getImageData(0,0,w,h).data;
  const img=hbOutCtx.createImageData(w,h), o=img.data;
  const horiz=P.hbDir==="right"||P.hbDir==="left", fwd=P.hbDir==="right"||P.hbDir==="down";
  const lines=horiz?h:w, span=horiz?w:h;
  const decay=Math.exp(-4/Math.max(1,P.hbLen*span));   // ~2% left after one streak length
  const lo=P.hbThresh, hi=Math.min(1.0001,P.hbThresh+Math.max(.005,P.hbSoft));
  const tint=P.hbColor==="tint"?hex2rgb(P.hbTint):null;
  const tick=Math.floor(renderTime*P.hbRate);
  for(let a=0;a<lines;a++){
    const gain=1-P.hbFlicker*smearHash(a,3.7,tick);
    let ar=0,ag=0,ab=0;
    for(let s=0;s<span;s++){
      const b=fwd?s:span-1-s, x=horiz?b:a, y=horiz?a:b, i=(y*w+x)*4;
      const r=src[i], g=src[i+1], bl=src[i+2];
      let k=((0.2126*r+0.7152*g+0.0722*bl)/255-lo)/(hi-lo);
      k=k<0?0:k>1?1:k; k=k*k*(3-2*k);
      const hr=tint?tint[0]*k:r*k, hg=tint?tint[1]*k:g*k, hb=tint?tint[2]*k:bl*k;
      ar*=decay; ag*=decay; ab*=decay;
      if(hr>ar) ar=hr; if(hg>ag) ag=hg; if(hb>ab) ab=hb;
      o[i]=ar*gain; o[i+1]=ag*gain; o[i+2]=ab*gain; o[i+3]=255;
    }
  }
  hbOutCtx.putImageData(img,0,0);
  octx.save();
  octx.globalCompositeOperation = P.hbBlend==="add" ? "lighter" : "screen";
  octx.imageSmoothingEnabled=true;
  octx.globalAlpha=Math.min(1,P.hbAmt);
  octx.drawImage(hbOutCv,0,0,outW,outH);
  if(P.hbAmt>1){ octx.globalAlpha=P.hbAmt-1; octx.drawImage(hbOutCv,0,0,outW,outH); }
  octx.restore();
}

function buildMaskTools(){
  const body=document.querySelector('.group[data-name="MASK"] .gbody');
  if(!body) return;
  const bar=document.createElement("div"); bar.className="btnrow";
  const draw=document.createElement("button"); draw.className="mini"; draw.id="btnDrawMask"; draw.textContent="Draw blocks";
  draw.onclick=()=>setDrawMask(!drawingMask);
  const clr=document.createElement("button"); clr.className="mini"; clr.textContent="Clear";
  clr.onclick=()=>{ P.maskRects=[]; updateMaskCount(); requestRender(); drawMaskOverlay(); };
  bar.append(draw,clr);
  const count=document.createElement("p"); count.className="note"; count.id="maskCount";
  body.append(bar,count);
  updateMaskCount();
}

function buildPalettes(){
  const body = document.querySelector('.group[data-name="COLOR"] .gbody');
  if(!body) return;
  const cap=document.createElement("p"); cap.className="note"; cap.textContent="Phosphor";
  const grid=document.createElement("div"); grid.className="swatches";
  PALETTES.forEach(([name,ink,paper])=>{
    const b=document.createElement("button");
    b.className="sw"; b.dataset.ink=ink; b.dataset.paper=paper;
    b.style.background=paper; b.style.color=ink;
    b.innerHTML=`<b>AB</b>${name}`;
    b.title=`${ink} on ${paper}`;
    b.onclick=()=>{ P.ink=ink; P.paper=paper; refreshControl("ink"); refreshControl("paper");
                    markDirty("ink"); markDirty("paper"); markPalette(); requestRender(); };
    grid.append(b);
  });
  const bar=document.createElement("div"); bar.className="btnrow";
  const swap=document.createElement("button"); swap.className="mini"; swap.textContent="Swap ink / paper";
  swap.onclick=()=>{ const i=P.ink; P.ink=P.paper; P.paper=i;
    refreshControl("ink"); refreshControl("paper"); markDirty("ink"); markDirty("paper");
    markPalette(); requestRender(); };
  bar.append(swap);
  body.append(cap,grid,bar);
  markPalette();
}
function markPalette(){
  document.querySelectorAll(".sw").forEach(b=>{
    b.classList.toggle("on", b.dataset.ink===P.ink && b.dataset.paper===P.paper);
  });
}

function buildPresetPanel(){
  const host=$("#panelR");
  const g=document.createElement("div"); g.className="group";
  g.innerHTML='<h3>Presets</h3>';
  const body=document.createElement("div"); body.className="gbody";
  g.querySelector("h3").onclick=()=>g.classList.toggle("collapsed");

  const built=document.createElement("div"); built.className="plist";
  Object.keys(BUILTIN).forEach(name=>{
    const b=document.createElement("button"); b.className="pload"; b.textContent=name;
    b.onclick=()=>applyPreset(BUILTIN[name]);
    const row=document.createElement("div"); row.className="pitem"; row.append(b); built.append(row);
  });
  const userWrap=document.createElement("div"); userWrap.className="plist"; userWrap.id="userPresets";
  const hr=document.createElement("p"); hr.className="note"; hr.textContent="Your presets";

  const bar=document.createElement("div"); bar.className="btnrow";
  const bSave=document.createElement("button"); bSave.className="mini"; bSave.textContent="Save as…";
  bSave.onclick=()=>{
    const name=prompt("Preset name"); if(!name) return;
    const u=userPresets(); u[name]=JSON.parse(JSON.stringify(P)); saveUser(u); renderUserPresets();
  };
  const bExp=document.createElement("button"); bExp.className="mini"; bExp.textContent="Export";
  bExp.onclick=()=>download(new Blob([JSON.stringify(P,null,2)],{type:"application/json"}),`asciivd-preset_${stamp()}.json`);
  const bExpAll=document.createElement("button"); bExpAll.className="mini"; bExpAll.textContent="Export saved";
  bExpAll.title="Every saved preset in one file — Import it into another copy to carry them across";
  bExpAll.onclick=()=>{
    const u=userPresets(); if(!Object.keys(u).length){ alert("No saved presets to export"); return; }
    download(new Blob([JSON.stringify({asciivdPresets:u},null,2)],{type:"application/json"}),`asciivd-presets_${stamp()}.json`);
  };
  const bImp=document.createElement("button"); bImp.className="mini"; bImp.textContent="Import";
  bImp.onclick=()=>$("#presetIn").click();
  const bRst=document.createElement("button"); bRst.className="mini"; bRst.textContent="Reset all";
  bRst.onclick=()=>applyPreset({});
  bar.append(bSave,bExp,bExpAll,bImp,bRst);

  body.append(built,bar,hr,userWrap);
  g.append(body); host.append(g);
  renderUserPresets();
}
function renderUserPresets(){
  const wrap=$("#userPresets"); if(!wrap) return;
  const u=userPresets(); wrap.innerHTML="";
  const keys=Object.keys(u);
  if(!keys.length){ const p=document.createElement("p"); p.className="note"; p.textContent="none saved yet"; wrap.append(p); return; }
  keys.forEach(name=>{
    const row=document.createElement("div"); row.className="pitem";
    const b=document.createElement("button"); b.className="pload"; b.textContent=name;
    b.onclick=()=>applyPreset(u[name]);
    const d=document.createElement("button"); d.className="pdel"; d.textContent="×";
    d.onclick=()=>{ const uu=userPresets(); delete uu[name]; saveUser(uu); renderUserPresets(); };
    row.append(b,d); wrap.append(row);
  });
}
// Saved presets live in this origin's browser storage, so the copy opened as a file and
// the one served from localhost keep separate libraries. "Export saved" then Import here
// carries them across. Existing names are never overwritten; a clash is kept as "name (2)".
function mergeUserPresets(incoming){
  const u=userPresets(); let added=0;
  for(const [name,p] of Object.entries(incoming)){
    const same=JSON.stringify(p);
    if(Object.keys(u).some(k=>(k===name||k.startsWith(name+" ("))&&JSON.stringify(u[k])===same)) continue;
    let key=name; for(let i=2; key in u; i++) key=`${name} (${i})`;
    u[key]=p; added++;
  }
  saveUser(u); renderUserPresets();
  alert(added?`Added ${added} saved preset${added>1?"s":""}.`:"Those presets are already saved here.");
}
$("#presetIn").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let data; try{ data=JSON.parse(r.result); }catch(err){ alert("Bad preset file"); return; }
    if(data&&data.asciivdPresets){ mergeUserPresets(data.asciivdPresets); return; }
    try{ applyPreset(data); }catch(err){ alert("Bad preset file"); }
  };
  r.readAsText(f); e.target.value="";
};

function buildHelpPanel(){
  const g=document.createElement("div"); g.className="group collapsed";
  g.innerHTML='<h3>Keys &amp; notes</h3>';
  g.querySelector("h3").onclick=()=>g.classList.toggle("collapsed");
  const b=document.createElement("div"); b.className="gbody";
  b.innerHTML=`<p class="note">
  <kbd>space</kbd> play / pause<br>
  <kbd>←</kbd> <kbd>→</kbd> step one frame<br>
  <kbd>[</kbd> <kbd>]</kbd> set in / out point<br>
  <kbd>r</kbd> record · <kbd>s</kbd> save frame<br>
  <kbd>1…9</kbd> load built-in preset<br>
  <kbd>esc</kbd> stop an export or recording<br>
  double-click a slider label to reset it
  </p>
  <p class="note">Pixel size controls chunkiness: the frame is processed at width ÷ pixel size, then blown up with nearest-neighbour, so dithering stays crisp.</p>
  <p class="note"><b>Record</b> captures in real time from the canvas, writing MP4 (H.264) where the browser supports it and WebM otherwise; keeps the original audio. If the render can't hold the export fps, lower the width or raise pixel size.</p>
  <p class="note"><b>Export MP4</b> encodes H.264 with WebCodecs, seeking frame by frame — nothing is dropped however heavy the effect is, and audio is re-encoded to AAC. Needs WebCodecs (Chrome, Edge, recent Firefox/Zen). This is the one to use for finished pieces.</p>
  <p class="note">Each exported frame is checked against the decoded source before it is encoded, and re-grabbed if the browser had not painted it yet — so a heavy effect or a slow seek can never write blank frames into the file.</p>
  <p class="note"><b>PNG sequence</b> is lossless frames for a colour-managed grade.</p>
  <p class="note">While an export runs, its button becomes the stop control — click it or press <kbd>esc</kbd>. A stopped PNG sequence keeps every frame already written; a stopped MP4 is still muxed and saved, marked <i>_partial</i>, so a long encode is never wasted.</p>
  <p class="note">A / B transitions run inside the export — set a wipe or dissolve and the render carries the reveal, so there is no second pass to cut against in the edit.</p>
  <p class="note">Blocks: hit <b>Draw blocks</b>, then drag on empty canvas to add one. While drawing is active each block carries a centre handle to move it and four corner handles to resize it; click to select, <kbd>⌫</kbd> or double-click to remove, <kbd>esc</kbd> to finish. Blocks stay with the footage when you change look.</p>
  <p class="note">Time displacement and persistence build up over consecutive frames, so scrubbing around shows them mid-thought; play through, or export, and they settle. Exports pre-roll the history first.</p>
  <p class="note">8-bit quantises colour to a hardware palette. Pixel size sets the chunkiness, dither amount decides how hard the screen works to fake the missing colours, and attribute clash limits each cell to two of them — the Spectrum tell. On <b>auto</b> the palette is read from the picture; hit <b>Lock palette</b> once a shot looks right so it stops drifting.</p>
  <p class="note">Smear lines: hit <b>Draw lines</b> in SMEAR, then drag down the canvas for a vertical line that bleeds sideways, or across for a horizontal one that bleeds up or down. Drag a line to move it, its ends to resize, <kbd>⌫</kbd> or double-click to remove. <b>After effect</b> streaks the finished frame; <b>before effect</b> streaks the picture first, so the smear gets dithered too.</p>
  <p class="note">Highlight bleed drags anything brighter than the highlight level across the frame. Push it hard with <b>add</b> blending and a tint for burnt-out, overdriven light.</p>
  <p class="note">LCD mode: pixel pitch sets the screen resolution, and the drop shadow is what sells it — keep it offset down and to the right, and soft. Use <b>threshold</b> dither for bold silhouettes like the old games, or Atkinson for real footage. The glass texture is fixed to the screen, not the picture, so it stays put while the video moves.</p>
  <p class="note">Riso mode prints ink on paper, so it wants a light paper colour and the multiply blend — selecting it swaps a black paper for stock automatically. Misregistration is what sells it: 4–12px, and a coarser pixel size than you would use for a straight dither.</p>
  <p class="note">Everything is local. No uploads, no server.</p>`;
  g.append(b); $("#panelR").append(g);
}

/* ====================================================================== */
$("#btnOpen").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{ const f=e.target.files[0]; if(f) loadFile(f); e.target.value=""; };
$("#btnCam").onclick=startCam;

const drop=$("#drop");
addEventListener("dragover",e=>{ e.preventDefault(); drop.classList.remove("hide"); drop.classList.add("hot"); });
addEventListener("dragleave",e=>{ if(e.relatedTarget) return; drop.classList.remove("hot"); if(srcReady) drop.classList.add("hide"); });
addEventListener("drop",e=>{
  e.preventDefault(); drop.classList.remove("hot");
  const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("video/")||/\.(mp4|mov|webm|mkv|m4v)$/i.test(f.name));
  if(f) loadFile(f); else if(srcReady) drop.classList.add("hide");
});
drop.onclick=()=>$("#fileIn").click();

addEventListener("keydown",e=>{
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  const k=e.key;
  if((k==="Backspace"||k==="Delete") && drawingMask){
    if(deleteSelectedBlock()){ e.preventDefault(); return; }
  }
  if((k==="Backspace"||k==="Delete") && drawingLines){
    if(deleteSelectedLine()){ e.preventDefault(); return; }
  }
  if(k==="Escape"){
    if(drawingMask){ setDrawMask(false); e.preventDefault(); return; }
    if(drawingLines){ setDrawLines(false); e.preventDefault(); return; }
    if(cancelExport()) e.preventDefault();
    return;
  }
  if(k===" "){ e.preventDefault(); togglePlay(); }
  else if(k==="ArrowRight"){ e.preventDefault(); step(+1); }
  else if(k==="ArrowLeft"){ e.preventDefault(); step(-1); }
  else if(k==="["){ $("#btnIn").click(); }
  else if(k==="]"){ $("#btnOut").click(); }
  else if(k==="r"){ $("#btnRec").click(); }
  else if(k==="s"){ $("#btnPng").click(); }
  else if(/^[1-9]$/.test(k)){ const n=Object.keys(BUILTIN)[+k-1]; if(n) applyPreset(BUILTIN[n]); }
});

buildUI();
refreshAll();
resizeOutput();
octx.fillStyle="#000"; octx.fillRect(0,0,out.width,out.height);
